[build-system]
requires = ["setuptools==84.1.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "labflow-dreamer"
version = "0.1.0"
description = "Train a Dreamer-style Isaac Lab policy with SageMaker AI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LabFlow Dreamer contributors" }]
dependencies = [
  "gymnasium==1.0.0",
  "numpy==2.1.3",
  "torch==2.5.1",
]

[project.optional-dependencies]
sagemaker = [
  "boto3==1.35.99",
]

[tool.setuptools.packages.find]
where = ["src"]
